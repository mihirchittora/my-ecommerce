spring:
  application:
    name: cart-service
  datasource:
    url: ${CART_DB_URL:jdbc:postgresql://localhost:5436/cart_db}
    username: ${CART_DB_USERNAME:cart}
    password: ${CART_DB_PASSWORD:cart}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CART_SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8085}
    audience: ${AUTH_AUDIENCE:ecommerce-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}

cart:
  currency: ${CART_CURRENCY:INR}
  max-items: ${CART_MAX_ITEMS:100}
  max-quantity-per-sku: ${CART_MAX_QUANTITY_PER_SKU:100}
  expiration-duration: ${CART_EXPIRATION_DURATION:30d}
  expiration:
    fixed-delay-ms: ${CART_EXPIRATION_FIXED_DELAY_MS:60000}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    service-token: ${CART_CATALOG_SERVICE_TOKEN:}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:3000}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${ORDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ORDER_READ_TIMEOUT_MS:10000}

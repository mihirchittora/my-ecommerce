services:
  cart-db:
    image: postgres:17
    container_name: ecommerce-cart-db
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
    ports:
      - "5436:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-service:
    build: .
    container_name: ecommerce-cart-service
    ports:
      - "8084:8084"
    environment:
      CART_SERVER_PORT: 8084
      CART_DB_URL: jdbc:postgresql://cart-db:5432/cart_db
      CART_DB_USERNAME: cart
      CART_DB_PASSWORD: cart
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:8081}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://host.docker.internal:8083}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://host.docker.internal:8082}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8085}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ecommerce-api}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://host.docker.internal:8085/.well-known/jwks.json}
      CART_CURRENCY: ${CART_CURRENCY:-INR}
      CART_EXPIRATION_DURATION: ${CART_EXPIRATION_DURATION:-30d}
      CART_MAX_ITEMS: ${CART_MAX_ITEMS:-100}
      CART_MAX_QUANTITY_PER_SKU: ${CART_MAX_QUANTITY_PER_SKU:-100}
      CART_CATALOG_SERVICE_TOKEN: ${CART_CATALOG_SERVICE_TOKEN:-dev-cart-to-catalog}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      # Keep the local JVM below the Docker/Colima memory budget when all services run together.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m}
    depends_on:
      cart-db:
        condition: service_healthy

volumes:
  cart-db-data:

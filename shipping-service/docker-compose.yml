services:
  shipping-db:
    image: postgres:17
    container_name: shipping-db
    environment:
      POSTGRES_DB: ${SHIPPING_DB_NAME:-shipping_db}
      POSTGRES_USER: ${SHIPPING_DB_USERNAME:-shipping}
      POSTGRES_PASSWORD: ${SHIPPING_DB_PASSWORD:-shipping}
    ports:
      - "${SHIPPING_DB_HOST_PORT:-5439}:5432"
    volumes:
      - shipping-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIPPING_DB_USERNAME:-shipping} -d ${SHIPPING_DB_NAME:-shipping_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  shipping-service:
    build: .
    container_name: shipping-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      shipping-db:
        condition: service_healthy
    environment:
      SHIPPING_SERVER_PORT: 8088
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms32m -Xmx128m}"
      SHIPPING_DB_URL: jdbc:postgresql://shipping-db:5432/${SHIPPING_DB_NAME:-shipping_db}
      SHIPPING_DB_USERNAME: ${SHIPPING_DB_USERNAME:-shipping}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:-shipping}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8085}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ecommerce-api}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://host.docker.internal:8085/.well-known/jwks.json}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://host.docker.internal:8083}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://host.docker.internal:8082}
      ORDER_TO_SHIPPING_SERVICE_TOKEN: ${ORDER_TO_SHIPPING_SERVICE_TOKEN:-dev-order-to-shipping}
      SHIPPING_TO_ORDER_SERVICE_TOKEN: ${SHIPPING_TO_ORDER_SERVICE_TOKEN:-dev-shipping-to-order}
      SHIPPING_TO_INVENTORY_SERVICE_TOKEN: ${SHIPPING_TO_INVENTORY_SERVICE_TOKEN:-dev-shipping-to-inventory}
      SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-SANDBOX}
      SHIPPING_WEBHOOK_SECRET: ${SHIPPING_WEBHOOK_SECRET:-dev-shipping-webhook-secret}
      EASYPOST_API_BASE_URL: ${EASYPOST_API_BASE_URL:-https://api.easypost.com/v2}
      EASYPOST_API_KEY: ${EASYPOST_API_KEY:-}
      EASYPOST_WEBHOOK_SECRET: ${EASYPOST_WEBHOOK_SECRET:-}
      EASYPOST_WEBHOOK_TIMESTAMP_TOLERANCE_MINUTES: ${EASYPOST_WEBHOOK_TIMESTAMP_TOLERANCE_MINUTES:-1}
      EASYPOST_ORIGIN_NAME: ${EASYPOST_ORIGIN_NAME:-}
      EASYPOST_ORIGIN_PHONE: ${EASYPOST_ORIGIN_PHONE:-}
      EASYPOST_ORIGIN_LINE1: ${EASYPOST_ORIGIN_LINE1:-}
      EASYPOST_ORIGIN_CITY: ${EASYPOST_ORIGIN_CITY:-}
      EASYPOST_ORIGIN_STATE: ${EASYPOST_ORIGIN_STATE:-}
      EASYPOST_ORIGIN_POSTAL_CODE: ${EASYPOST_ORIGIN_POSTAL_CODE:-}
      EASYPOST_ORIGIN_COUNTRY: ${EASYPOST_ORIGIN_COUNTRY:-US}
    ports:
      - "${SHIPPING_HOST_PORT:-8088}:8088"

volumes:
  shipping-db-data:

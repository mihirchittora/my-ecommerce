services:
  auth-db:
    image: postgres:17
    container_name: ecommerce-auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    ports:
      - "${AUTH_DB_HOST_PORT:-5434}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: .
    container_name: ecommerce-auth-service
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      AUTH_SERVER_PORT: 8085
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8085}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ecommerce-api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@morrow.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Morrow Commerce}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms32m -Xmx128m}"
    ports:
      - "${AUTH_HOST_PORT:-8085}:8085"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth_postgres_data:

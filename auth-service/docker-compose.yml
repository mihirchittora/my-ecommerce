services:
  auth-db:
    image: postgres:17
    container_name: ecommerce-auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: .
    container_name: ecommerce-auth-service
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME:-auth_db}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      AUTH_SERVER_PORT: 8085
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8085}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ecommerce-api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "8085:8085"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth_postgres_data:

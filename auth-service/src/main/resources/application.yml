spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5434/auth_db}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${AUTH_SERVER_PORT:8085}

auth:
  issuer: ${AUTH_ISSUER:http://localhost:8085}
  audience: ${AUTH_AUDIENCE:ecommerce-api}
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
  key-id: ${JWT_KEY_ID:auth-key-1}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  login:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${AUTH_LOCK_DURATION:PT15M}
  bootstrap:
    admin-email: ${INITIAL_ADMIN_EMAIL:}
    admin-password: ${INITIAL_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

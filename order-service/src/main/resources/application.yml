spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${ORDER_DB_USERNAME:order}
    password: ${ORDER_DB_PASSWORD:order}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ORDER_SERVER_PORT:8083}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8085}
    audience: ${AUTH_AUDIENCE:ecommerce-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    service-token: ${CATALOG_SERVICE_TOKEN:}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:3000}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    service-token: ${INVENTORY_SERVICE_TOKEN:}
    connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:3000}
  reservation:
    expiry-minutes: ${ORDER_RESERVATION_EXPIRY_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

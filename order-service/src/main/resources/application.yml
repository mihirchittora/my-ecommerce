spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${ORDER_DB_USERNAME:order}
    password: ${ORDER_DB_PASSWORD:order}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${ORDER_SERVER_PORT:8083}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8085}
    audience: ${AUTH_AUDIENCE:ecommerce-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    service-token: ${CATALOG_SERVICE_TOKEN:}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:3000}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
    service-token: ${INVENTORY_SERVICE_TOKEN:}
    connect-timeout-ms: ${INVENTORY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${INVENTORY_READ_TIMEOUT_MS:3000}
  shipping:
    base-url: ${SHIPPING_SERVICE_URL:http://localhost:8088}
    service-token: ${ORDER_TO_SHIPPING_SERVICE_TOKEN:}
    connect-timeout-ms: ${SHIPPING_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SHIPPING_READ_TIMEOUT_MS:3000}
    free-threshold: ${ORDER_FREE_SHIPPING_THRESHOLD:500}
    standard-charge: ${ORDER_STANDARD_SHIPPING_CHARGE:79}
    express-charge: ${ORDER_EXPRESS_SHIPPING_CHARGE:149}
    free-shipping-countries: ${ORDER_FREE_SHIPPING_COUNTRIES:IN}
  reservation:
    expiry-minutes: ${ORDER_RESERVATION_EXPIRY_MINUTES:15}
  tax:
    default-rate: ${ORDER_TAX_DEFAULT_RATE:18}
    countries: ${ORDER_TAX_COUNTRIES:IN}
  invoice:
    seller-name: ${INVOICE_SELLER_NAME:Morrow Commerce}
    seller-address: ${INVOICE_SELLER_ADDRESS:India}
  returns:
    window-days: ${ORDER_RETURN_WINDOW_DAYS:30}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8087}
    service-token: ${ORDER_TO_PAYMENT_SERVICE_TOKEN:}
  cod:
    enabled: ${ORDER_COD_ENABLED:true}
    max-order-amount: ${ORDER_COD_MAX_ORDER_AMOUNT:50000}
    countries: ${ORDER_COD_COUNTRIES:IN}
    currencies: ${ORDER_COD_CURRENCIES:INR}
  service-auth:
    shipping-token: ${SHIPPING_TO_ORDER_SERVICE_TOKEN:}
    payment-token: ${PAYMENT_TO_ORDER_SERVICE_TOKEN:}
  fulfillment:
    outbox-poll-ms: ${FULFILLMENT_OUTBOX_POLL_MS:5000}
    outbox-batch-size: ${FULFILLMENT_OUTBOX_BATCH_SIZE:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

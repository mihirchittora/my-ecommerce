spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5438/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment}
    password: ${PAYMENT_DB_PASSWORD:payment}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PAYMENT_SERVER_PORT:8087}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8085}
    audience: ${AUTH_AUDIENCE:ecommerce-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
    service-token: ${ORDER_SERVICE_TOKEN:}
    payment-update-path: ${ORDER_PAYMENT_UPDATE_PATH:/internal/orders/{orderId}/payment-events}
    connect-timeout-ms: ${ORDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ORDER_READ_TIMEOUT_MS:3000}
  service-auth:
    order-token: ${ORDER_TO_PAYMENT_SERVICE_TOKEN:}
  gateway:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:SANDBOX}
    sandbox:
      webhook-secret: ${PAYMENT_SANDBOX_WEBHOOK_SECRET:dev-sandbox-webhook-secret}
  currencies: ${PAYMENT_SUPPORTED_CURRENCIES:INR,USD,EUR}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

services:
  postgres:
    image: postgres:17
    container_name: ecommerce-catalog-db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "${CATALOG_DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ecommerce-catalog-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce
      PORT: 8081
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8085}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ecommerce-api}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-http://host.docker.internal:8085/.well-known/jwks.json}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:-dev-inventory-to-catalog}
      ORDER_SERVICE_TOKEN: ${ORDER_SERVICE_TOKEN:-dev-order-to-catalog}
      CART_SERVICE_TOKEN: ${CART_SERVICE_TOKEN:-dev-cart-to-catalog}
    ports:
      - "${CATALOG_HOST_PORT:-8081}:8081"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

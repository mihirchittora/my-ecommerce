spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      # Allow multipart headers/boundaries while keeping the file itself capped at 5 MB.
      max-request-size: 6MB

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8085}
    audience: ${AUTH_AUDIENCE:ecommerce-api}
    jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8085/.well-known/jwks.json}
  images:
    storage-dir: ${IMAGE_STORAGE_DIR:./uploads}
    max-size-bytes: ${IMAGE_MAX_SIZE_BYTES:5242880}
  service-auth:
    inventory-token: ${INVENTORY_SERVICE_TOKEN:}
